services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: space-shooter-dev
    ports:
      - 127.0.0.1:5173:5173
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    stdin_open: true
    tty: true
    restart: unless-stopped
  
  prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: space-shooter-prod
    ports:
      - 8080:80
    restart: unless-stopped
