server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;

    gzip_types
	text/plain
	text/css
	text/javascript
	application/javascript
	application/json
	application/wasm
	application/xml
	image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
